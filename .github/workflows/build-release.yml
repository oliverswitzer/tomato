name: Build & Release DMG

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download patched screenpipe binary
        run: |
          mkdir -p bin
          curl -fSL "https://github.com/oliverswitzer/screenpipe/releases/download/v0.1.0-patched/screenpipe" -o bin/screenpipe
          chmod +x bin/screenpipe

      - name: Install ffmpeg and ffprobe
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" bin/ffmpeg
          cp "$(which ffprobe)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Compile request-screen-access
        run: |
          swiftc scripts/request-screen-access.swift -o bin/request-screen-access
          chmod +x bin/request-screen-access

      - name: Build unsigned DMG
        run: |
          npx electron-rebuild
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomato-dmg
          path: release/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH=$(ls release/*.dmg | head -1)
          DMG_NAME=$(basename "$DMG_PATH")

          # Delete existing 'latest' release if present
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

          # Create new release with the DMG renamed to Tomato.dmg
          cp "$DMG_PATH" release/Tomato.dmg
          gh release create latest \
            --title "Tomato (latest build)" \
            --notes "${{ github.event.inputs.release_notes }}" \
            release/Tomato.dmg
