name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import code-signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Download patched screenpipe binary
        run: |
          mkdir -p bin
          curl -fSL "https://github.com/oliverswitzer/screenpipe/releases/download/v0.1.0-patched/screenpipe" -o bin/screenpipe
          chmod +x bin/screenpipe

      - name: Install ffmpeg and ffprobe
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" bin/ffmpeg
          cp "$(which ffprobe)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Compile request-screen-access
        run: |
          swiftc scripts/request-screen-access.swift -o bin/request-screen-access
          chmod +x bin/request-screen-access

      - name: Build app
        run: npm run build

      - name: Package app
        run: |
          npx electron-rebuild
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --dir --publish never

      - name: Sign app with Developer ID
        env:
          CODESIGN_IDENTITY: "Developer ID Application"
        run: bash scripts/sign.sh

      - name: Verify code signature
        run: |
          echo "=== Signing identity and designated requirement ==="
          codesign -dvvv release/mac-arm64/Tomato.app 2>&1 | grep -E "(Authority|Identifier|CDHash|Signature|TeamIdentifier)"
          echo ""
          echo "=== Designated requirement (Keychain ACL basis) ==="
          codesign -d --requirements - release/mac-arm64/Tomato.app 2>&1

      - name: Create DMG
        run: hdiutil create -volname "Tomato" -srcfolder release/mac-arm64/Tomato.app -ov -format UDZO release/Tomato.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          RESULT=$(xcrun notarytool submit release/Tomato.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)

          echo "$RESULT" | python3 -m json.tool

          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

      - name: Staple notarization ticket
        run: xcrun stapler staple release/Tomato.dmg

      - name: Staple notarization ticket to app bundle
        run: xcrun stapler staple release/mac-arm64/Tomato.app

      - name: Create ZIP archive
        run: cd release/mac-arm64 && zip -ry ../Tomato.zip Tomato.app

      - name: Generate latest-mac.yml
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_SIZE=$(stat -f%z release/Tomato.dmg)
          ZIP_SIZE=$(stat -f%z release/Tomato.zip)
          DMG_SHA512=$(shasum -a 512 release/Tomato.dmg | awk '{print $1}' | xxd -r -p | base64)
          ZIP_SHA512=$(shasum -a 512 release/Tomato.zip | awk '{print $1}' | xxd -r -p | base64)

          cat > release/latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: Tomato-${VERSION}.dmg
              sha512: ${DMG_SHA512}
              size: ${DMG_SIZE}
            - url: Tomato-${VERSION}.zip
              sha512: ${ZIP_SHA512}
              size: ${ZIP_SIZE}
          path: Tomato-${VERSION}.dmg
          sha512: ${DMG_SHA512}
          releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          EOF

      - name: Upload artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Upload versioned artifacts
          aws s3 cp release/Tomato.dmg "s3://tomato-releases/Tomato-${VERSION}.dmg" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release/Tomato.zip "s3://tomato-releases/Tomato-${VERSION}.zip" --endpoint-url "$R2_ENDPOINT"

          # Upload/overwrite latest aliases
          aws s3 cp release/Tomato.dmg "s3://tomato-releases/Tomato-latest.dmg" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release/Tomato.zip "s3://tomato-releases/Tomato-latest.zip" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release/latest-mac.yml "s3://tomato-releases/latest-mac.yml" --endpoint-url "$R2_ENDPOINT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomato-dmg
          path: release/Tomato.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing 'latest' release if present
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Release $(node -p \"require('./package.json').version\")"
          fi

          gh release create latest \
            --title "Tomato (latest build)" \
            --notes "$NOTES" \
            release/Tomato.dmg \
            release/Tomato.zip

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
