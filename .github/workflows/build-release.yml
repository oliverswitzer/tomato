name: Build & Release DMG

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import code-signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Download patched screenpipe binary
        run: |
          mkdir -p bin
          curl -fSL "https://github.com/oliverswitzer/screenpipe/releases/download/v0.1.0-patched/screenpipe" -o bin/screenpipe
          chmod +x bin/screenpipe

      - name: Install ffmpeg and ffprobe
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" bin/ffmpeg
          cp "$(which ffprobe)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Compile request-screen-access
        run: |
          swiftc scripts/request-screen-access.swift -o bin/request-screen-access
          chmod +x bin/request-screen-access

      - name: Build app
        run: npm run build

      - name: Package app
        run: |
          npx electron-rebuild
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --dir --publish never

      - name: Sign app with Developer ID
        env:
          CODESIGN_IDENTITY: "Developer ID Application"
        run: bash scripts/sign.sh

      - name: Create DMG
        run: hdiutil create -volname "Tomato" -srcfolder release/mac-arm64/Tomato.app -ov -format UDZO release/Tomato.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit release/Tomato.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple release/Tomato.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomato-dmg
          path: release/Tomato.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing 'latest' release if present
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

          gh release create latest \
            --title "Tomato (latest build)" \
            --notes "${{ github.event.inputs.release_notes }}" \
            release/Tomato.dmg

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
