<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Capture Debugger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #FBF7F1;
      color: #2A2A2A;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .capture-btn {
      padding: 12px 24px;
      background: #E2574C;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.15s;
    }
    .capture-btn:hover { background: #D04A3F; }
    .capture-btn:disabled { background: #BAA898; cursor: wait; }

    .meta {
      font-size: 13px;
      color: #6B6259;
      padding: 8px 12px;
      background: #F0EAE2;
      border-radius: 8px;
    }
    .meta strong { color: #2A2A2A; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #8B8477;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 120px;
      padding: 12px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.5;
      border: 1px solid #EFE8DD;
      border-radius: 10px;
      background: #FFFFFF;
      color: #2A2A2A;
      resize: vertical;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .error {
      color: #E2574C;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Screenpipe Capture Debugger</h1>

  <button class="capture-btn" id="capture-btn" onclick="doCapture()">Capture</button>

  <div class="meta" id="meta" style="display: none;"></div>

  <div class="section">
    <label>Raw OCR Text</label>
    <textarea id="raw-text" readonly placeholder="Click Capture to grab the latest screenpipe frame..."></textarea>
  </div>

  <div class="section">
    <label>Prompt Preview (what would be sent to Claude)</label>
    <textarea id="prompt-preview" readonly placeholder="The formatted prompt will appear here..."></textarea>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    async function doCapture() {
      const btn = document.getElementById('capture-btn');
      btn.disabled = true;
      btn.textContent = 'Capturing...';

      const result = await ipcRenderer.invoke('capture');

      btn.disabled = false;
      btn.textContent = 'Capture';

      const meta = document.getElementById('meta');
      const rawText = document.getElementById('raw-text');
      const promptPreview = document.getElementById('prompt-preview');

      if (result.error) {
        meta.style.display = 'block';
        meta.innerHTML = `<span class="error">${result.error}</span>`;
        rawText.value = '';
        promptPreview.value = '';
        return;
      }

      const frames = result.frames;
      const primary = frames[0];

      meta.style.display = 'block';
      meta.innerHTML = `<strong>App:</strong> ${primary.app} &nbsp;&middot;&nbsp; <strong>Window:</strong> ${primary.window} &nbsp;&middot;&nbsp; <strong>Time:</strong> ${new Date(primary.timestamp).toLocaleTimeString()} &nbsp;&middot;&nbsp; <strong>Focused:</strong> ${primary.focused ? 'Yes' : 'No'} &nbsp;&middot;&nbsp; <strong>Frames:</strong> ${frames.length}`;

      // Deduplicate windows and show all raw text
      const rawParts = frames.map(f =>
        `[${f.app} — ${f.window}] (${new Date(f.timestamp).toLocaleTimeString()})\n${f.text}`
      );
      rawText.value = rawParts.join('\n\n---\n\n');

      // Build the prompt that focus-tracker would send
      const seen = new Set();
      const windows = [];
      for (const f of frames) {
        const key = `${f.app} — ${f.window}`;
        if (!seen.has(key)) {
          seen.add(key);
          windows.push(key);
        }
      }

      const prompt = `Summarize what the user was doing in the last 15 seconds based on their screen content and typed text.

Write 1-2 short sentences. Be specific about which app and what task. Don't start with "The user was".

## ACTIVE WINDOWS

${windows.join('\n')}

## SCREEN CONTENT

${frames.map(f => `[${f.app} — ${f.window}]\n${f.text}`).join('\n\n')}`;

      promptPreview.value = prompt;
    }
  </script>
</body>
</html>
